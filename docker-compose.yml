services:
  postgres:
    image: postgres:16-alpine
    container_name: portal-conecta-seat-map-postgres
    restart: unless-stopped
    labels:
      portal.service: seat-map-postgres
      portal.environment: ${PORTAL_ENVIRONMENT:-local}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seat_map}
      POSTGRES_USER: ${POSTGRES_USER:-seat_map}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seat_map_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_USERNAME: ${MAVEN_USERNAME:-}
      secrets:
        - maven_password
    container_name: portal-conecta-seat-map-api
    restart: unless-stopped
    labels:
      portal.service: seat-map
      portal.environment: ${PORTAL_ENVIRONMENT:-local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-seat_map}
      DB_USERNAME: ${POSTGRES_USER:-seat_map}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-seat_map_dev_password}
      DB_DRIVER: org.postgresql.Driver
      JWT_SECRET: ${JWT_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      HUB_API_URL: ${HUB_API_URL:-http://host.docker.internal:8080}
    ports:
      - "${SERVER_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:

secrets:
  maven_password:
    environment: MAVEN_PASSWORD
