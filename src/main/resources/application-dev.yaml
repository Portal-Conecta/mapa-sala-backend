spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/seat_map}
    username: ${DB_USERNAME:seat_map}
    password: ${DB_PASSWORD:troque-esta-senha}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  flyway:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:change-me}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}