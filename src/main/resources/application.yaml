spring:
  application:
    name: seat-map
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      sampler: ${MANAGEMENT_OPENTELEMETRY_TRACING_SAMPLER:parentbased_traceidratio}

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: ${PORTAL_ENVIRONMENT:local}
      rename:
        logger_name: logger
      include:
        mdc: true

hub:
  api:
    url: ${HUB_API_URL:http://localhost:8081}
    mock-enabled: ${HUB_MOCK_ENABLED:false}
  mock:
    class-ids: []
    user-ids: []
    room-ids: []
    students-by-class: {}
