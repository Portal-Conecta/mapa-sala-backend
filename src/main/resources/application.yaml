spring:
  application:
    name: seat-map
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true

hub:
  api:
    url: ${HUB_API_URL:http://localhost:8080}
    mock-enabled: ${HUB_MOCK_ENABLED:true}
  mock:
    class-ids: []
    user-ids: []
    room-ids: []
    user-room-links: []
    students-by-class: {}
