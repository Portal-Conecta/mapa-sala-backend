
# ─────────────────────────────────────────────────────────────
# Aplicação
# ─────────────────────────────────────────────────────────────
spring.application.name=mapa-de-sala

# ─────────────────────────────────────────────────────────────
# PostgreSQL — configuração local de desenvolvimento
# Ajuste host/porta/banco/credenciais conforme seu ambiente
# ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/mapa_sala_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ─────────────────────────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Convenção de nomenclatura: camelCase Java → snake_case SQL
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# ─────────────────────────────────────────────────────────────
# Flyway
# ─────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true