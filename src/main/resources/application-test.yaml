spring:
  datasource:
    url: jdbc:h2:mem:mapa_sala_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never
  flyway:
    enabled: false

logging:
  level:
    root: WARN

hub:
  base-url: http://localhost:8080

app:
  jwt:
    secret: test-jwt-secret-key-for-unit-and-integration-tests-only
    access-token-expiration: 86400000
    refresh-token-expiration: 86400000