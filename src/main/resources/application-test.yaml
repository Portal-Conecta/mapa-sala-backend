spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:mapa_sala_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never
  flyway:
    enabled: false

logging:
  level:
    root: WARN

hub:
  api:
    url: http://localhost:8080
    mock-enabled: true
  mock:
    class-ids:
      - bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb
    user-ids:
      - cccccccc-cccc-cccc-cccc-cccccccccccc
    room-ids:
      - 11111111-1111-1111-1111-111111111111
    students-by-class:
      bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb:
        - id: dddddddd-dddd-dddd-dddd-dddddddddddd
          name: Ana Silva
        - id: eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee
          name: Bruno Costa
    accessible-class-ids-by-user:
      cccccccc-cccc-cccc-cccc-cccccccccccc:
        - bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb

app:
  jwt:
    secret: test-jwt-secret-key-for-unit-and-integration-tests-only
    access-token-expiration: 86400000
    refresh-token-expiration: 86400000